aid: boomerang
name: Boomerang
description: Boomerang, from Baydin Inc, is a productivity software company founded in 2010 that builds
  email management and meeting scheduling tools. Its products include Boomerang for Gmail and Boomerang
  for Outlook browser extensions, Boomerang mobile apps for iOS and Android, and GQueues, a task manager
  for Google Workspace teams. Boomerang lets users schedule email to send later, snooze messages back to
  the inbox, track responses with read receipts and follow-up reminders, share availability and book
  meetings without back-and-forth, and use AI writing assistance. With over 2 million active customers,
  the platform has processed more than 500 million messages. Boomerang is a consumer and team-facing
  productivity suite delivered as browser extensions and apps rather than a developer API platform; it
  was surfaced as a portfolio company of 500 Global and added to the API Evangelist network.
